name: zego_uikit
description: ZegoUIKit is a low-code offering with pre-built and UI-ready components, such as AudioVideoView, CameraButtons, etc. Save time and assemble features fast with ZegoUIKit.
version: 2.29.4
homepage: https://www.zegocloud.com/

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  zego_plugin_adapter: ^2.14.2

  # Local patched Express package: iOS PlatformView sends a fallback View ID
  # over a dedicated MethodChannel when Flutter drops onPlatformViewCreated.
  zego_express_engine_for_uikit: ^3.25.0+1

  device_info_plus: ^13.3.0
  encrypt: ^5.0.3
  flutter_logs_yoer: ^2.2.8
  permission_handler: ^13.0.2
  native_device_orientation: ^2.0.3
  wakelock_plus: ^1.8.1
  cached_network_image: ^4.0.4
  file_picker: ^13.1.0
  plugin_platform_interface: ^2.1.8
  visibility_detector: ^0.4.0+2
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  archive: ^4.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0 # run 'flutter pub run import_sorter:main'
  lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
  plugin:
    platforms:
      android:
        package: com.zegocloud.uikit.zego_uikit_plugin
        pluginClass: ZegoUikitPlugin
      ios:
        pluginClass: ZegoUikitPlugin

linter:
  rules:
    public_member_api_docs: true
